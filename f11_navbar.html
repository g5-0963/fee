<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-size: 1.2rem;
            color: white;
        }
        body{
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <header 
        style="
            padding: 10px;
            height: 10vh;
            background-color: rgb(81, 146, 2);
            display: flex;
            align-items: center;
            "
        >
        <nav> Navigation Links</nav>
    </header>
    <section style="display:flex; justify-content: space-between;">
    <aside
        style="
            padding: 10px;
            height: 80vh;
            width: 20%;
            background-color: rgb(14,127,198);
            "
        >
        SideBar 
    </aside>
    <main
            style="
            padding: 10px;
            height: 80vh;
            width: 60%;
            background-color: rgb(168, 144, 23);
            "
        >
        Main Content
    </main>
    <article
            style="
            padding: 10px;
            height: 80vh;
            width: 20%;
            background-color: rgb(92, 168, 215);
            "
        >
        Article
    </article>
    </section>
    <footer 
        style="
            padding: 10px;
            height: 10vh;
            background-color: rgb(168, 105, 189);
            display: flex;
            align-items: center;
            "
        >
        <nav> Harman 0963 </nav>
    </footer>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Centered Boxes</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      
    }

    .container {
      display: grid;
      grid-template-columns: repeat(2,250px);
      grid-template-rows:repeat(2,150px);
      gap: 10px;
    }

    .box {
      height: 150px;
      background:blue;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      
      border-radius: 10px;
     
      
    }

    
    

    
    @media (max-width: 480px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
    <div class="box"></div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectangle Pattern</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: black;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .middle {
            display: flex;
            gap: 30px;
        }

        .box {
            width: 170px;
            height: 90px;
           
            background-color:blue;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="box"></div>

        <div class="middle">
            <div class="box"></div>
            <div class="box"></div>
        </div>

        <div class="box"></div>
    </div>

</body>
</html>
